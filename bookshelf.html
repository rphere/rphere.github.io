<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Bookshelf · Ravali Pochampally</title>
  <meta name="description" content="Non-fiction books Ravali Pochampally has enjoyed and recommends: business and technology, science, investigative journalism, lifestyle and memoirs.">
  <link rel="canonical" href="https://ravalip.com/bookshelf.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

</head>
<body>
  <div class="page page-wide">
    <p class="crumb"><a href="./">← Ravali Pochampally</a></p>
    <h1>📚 Bookshelf</h1>
    <p class="lede">I mostly read non-fiction, and good non-fiction recommendations have always been hard to come by. So I thought I'd jot down some notes on the books I've enjoyed, in case they help someone else find their next read.</p>

    <!-- Rotating spotlight: filled in from the BOOKS list below -->
    <section class="spotlight" aria-roledescription="carousel" aria-label="Featured books">
      <div class="spot-stage" id="spot-stage" aria-live="polite"></div>
      <div class="spot-controls">
        <button class="spot-btn" id="spot-prev" aria-label="Previous book">‹</button>
        <div class="spot-dots" id="spot-dots" role="tablist"></div>
        <button class="spot-btn" id="spot-next" aria-label="Next book">›</button>
      </div>
    </section>

    <nav class="shelf-nav" id="shelf-nav" aria-label="Sections"></nav>

    <!-- Shelves: one per section, filled in from the BOOKS list below -->
    <div id="shelves"></div>
  </div>

  <script>
    /*
      To add a book: add a line to the right section below.
      cover = file in images/books/, sub = subtitle (optional), isbn = 13-digit ISBN.
      note = your snippet, shown in the spotlight at the top (leave "" to show none).
      Links go to that edition on Bookshop.org. To use a different page, add url: "https://...".
    */
    const BOOKS = [
      { section: "Business and Technology", items: [
        { title: "Black Edge", sub: "Inside Information, Dirty Money, and the Quest to Bring Down the Most Wanted Man on Wall Street", author: "Sheelah Kolhatkar", cover: "black-edge", isbn: "9780812985795", note: "How the SEC and FBI spent years trying to catch Steve Cohen and SAC Capital, and why it was so hard to make the case stick." },
        { title: "The Billionaire's Apprentice", sub: "The Rise of the Indian-American Elite and the Fall of the Galleon Hedge Fund", author: "Anita Raghavan", cover: "billionaires-apprentice", isbn: "9781455504039", note: "The Galleon insider trading case, where the accused, Raj Rajaratnam and Rajat Gupta, and the prosecutor, Preet Bharara, were all South Asian immigrants. It doubles as a portrait of a generation that rose to the top of Wall Street and corporate America." },
        { title: "When Genius Failed", sub: "The Rise and Fall of Long-Term Capital Management", author: "Roger Lowenstein", cover: "when-genius-failed", isbn: "9780375758256", note: "Two Nobel laureates, a team of star traders, and a fund that nearly took down Wall Street in 1998. Fascinating case study of when mathematical models can lead you astray." },
        { title: "Zero to One", sub: "Notes on Startups, or How to Build the Future", author: "Peter Thiel with Blake Masters", cover: "zero-to-one", isbn: "9780804139298", note: "Short and opinionated. Lessons learnt from building startups and thinking about the future." },
        { title: "The Everything Store", sub: "Jeff Bezos and the Age of Amazon", author: "Brad Stone", cover: "everything-store", isbn: "9780316219266", note: "Amazon's rise from an online bookstore, and the fascinating early history of the iconic company." },
      ]},
      { section: "Science", items: [
        { title: "Astrophysics for People in a Hurry", author: "Neil deGrasse Tyson", cover: "astrophysics", isbn: "9780393609394", note: "The universe in about 200 pages. Each chapter is short enough to read in one sitting." },
        { title: "The Emperor of All Maladies", sub: "A Biography of Cancer", author: "Siddhartha Mukherjee", cover: "emperor-of-all-maladies", isbn: "9781439170915", note: "A history of cancer written like a biography, with as much about the doctors and patients as the science." },
        { title: "The Sixth Extinction", sub: "An Unnatural History", author: "Elizabeth Kolbert", cover: "sixth-extinction", isbn: "9781250062185", note: "Kolbert visits reefs, rainforests and labs to show an extinction that is happening now, not someday." },
        { title: "Sapiens", sub: "A Brief History of Humankind", author: "Yuval Noah Harari", cover: "sapiens", isbn: "9780062316097", note: "All of human history built around one idea. We're the only species that cooperates through shared stories like money, nations and religion." },
        { title: "The Death and Life of the Great Lakes", author: "Dan Egan", cover: "death-and-life-great-lakes", isbn: "9780393355550", url: "https://bookshop.org/p/books/the-death-and-life-of-the-great-lakes-dan-egan/406b91a2994bd4eb?ean=9780393355550", note: "How invasive mussels, shipping canals and farm runoff remade the Great Lakes. Much more gripping than a book about lakes has any right to be." },
      ]},
      { section: "Investigative Journalism", items: [
        { title: "Empire of Pain", sub: "The Secret History of the Sackler Dynasty", author: "Patrick Radden Keefe", cover: "empire-of-pain", isbn: "9780385545686", note: "Three generations of the Sackler family, from marketing Valium to selling OxyContin. Infuriating, and meticulously reported." },
        { title: "Bad Blood", sub: "Secrets and Lies in a Silicon Valley Startup", author: "John Carreyrou", cover: "bad-blood", isbn: "9781524731656", note: "The Theranos story from the WSJ reporter who broke it. Every chapter makes you wonder how nobody stopped it sooner." },
        { title: "Say Nothing", sub: "A True Story of Murder and Memory in Northern Ireland", author: "Patrick Radden Keefe", cover: "say-nothing", isbn: "9780307279286", note: "Starts with a mother of ten taken from her Belfast home in 1972 and widens into a gripping story of the Troubles, where silence is the ultimate survival tactic." },
        { title: "Red Notice", sub: "A True Story of High Finance, Murder, and One Man's Fight for Justice", author: "Bill Browder", cover: "red-notice", isbn: "9781476755748", note: "An investor uncovers a massive tax fraud in Russia, and his lawyer dies in prison for it. The story behind the Magnitsky Act." },
        { title: "Billion Dollar Whale", sub: "The Man Who Fooled Wall Street, Hollywood, and the World", author: "Tom Wright and Bradley Hope", cover: "billion-dollar-whale", isbn: "9780316436472", url: "https://bookshop.org/p/books/billion-dollar-whale-the-man-who-fooled-wall-street-hollywood-and-the-world-bradley-hope/942546a451bd9199?ean=9780316436472", note: "How Jho Low siphoned billions from Malaysia's 1MDB fund and spent it on yachts, parties and a Hollywood movie." },
      ]},
      { section: "Lifestyle", items: [
        { title: "The Blue Zones of Happiness", sub: "Lessons from the World's Happiest People", author: "Dan Buettner", cover: "blue-zones-happiness", isbn: "9781426218484", note: "Buettner studies the places where people are happiest and boils it down to things you can actually change, like where you live, who you spend time with and how you work." },
        { title: "Outlive", sub: "The Science and Art of Longevity", author: "Peter Attia with Bill Gifford", cover: "outlive", isbn: "9780593236598", note: "A practical take on living longer and living better. The chapters on exercise, strength training, and glucose monitoring are helpful." },
        { title: "How to Raise an Adult", sub: "Break Free of the Overparenting Trap and Prepare Your Kid for Success", author: "Julie Lythcott-Haims", cover: "how-to-raise-an-adult", isbn: "9781627791779", note: "Written by a former Stanford dean of freshmen who saw the negative effects of overparenting up close." },
        { title: "Deep Work", sub: "Rules for Focused Success in a Distracted World", author: "Cal Newport", cover: "deep-work", isbn: "9781455586691", note: "A clear case for long, undistracted stretches of focus, with concrete ways to get more of them." },
        { title: "Atomic Habits", sub: "An Easy & Proven Way to Build Good Habits & Break Bad Ones", author: "James Clear", cover: "atomic-habits", isbn: "9780735211292", url: "https://bookshop.org/p/books/atomic-habits-an-easy-proven-way-to-build-good-habits-break-bad-ones-james-clear/072529306f5772fe?ean=9780735211292", note: "The idea of building habits that stick by making small shifts in your lifestyle." },
      ]},
      { section: "Memoirs", items: [
        { title: "Bossypants", author: "Tina Fey", cover: "bossypants", isbn: "9780316056861", note: "Tina Fey on growing up, SNL and 30 Rock. Very funny, and sharper about work than you'd expect." },
        { title: "Born a Crime", sub: "Stories from a South African Childhood", author: "Trevor Noah", cover: "born-a-crime", isbn: "9780399588198", note: "Trevor Noah's childhood in apartheid South Africa, where his very existence was illegal. Check out the audiobook for Noah's narration, which adds a lot of humor and context." },
        { title: "Steve Jobs", author: "Walter Isaacson", cover: "steve-jobs", isbn: "9781451648539", note: "The biography of Steve Jobs, based on extensive interviews with him and those around him. It captures his vision, drive, and complexity." },
        { title: "Strangers", sub: "A Memoir of a Marriage", author: "Belle Burden", cover: "strangers", isbn: "9780593733318", note: "A memoir about a long marriage that ended without warning, and realizing how little she knew the person she'd married." },
        { title: "Man's Search for Meaning", author: "Viktor E. Frankl", cover: "mans-search-for-meaning", isbn: "9780807014271", note: "Deeply moving account of Frankl's experiences in the Nazi camps, and his argument that meaning, more than pleasure, is what keeps people going." },
        { title: "When Breath Becomes Air", author: "Paul Kalanithi", cover: "when-breath-becomes-air", isbn: "9780812988406", note: "A young neurosurgeon writes about his own terminal cancer diagnosis. Short, and very hard to forget." },
      ]},
    ];

    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const link = b => b.url || "https://bookshop.org/book/" + b.isbn;
    const img = b => "images/books/" + b.cover + ".jpg";

    // ---------- Shelves ----------
    const shelves = document.getElementById("shelves");
    const nav = document.getElementById("shelf-nav");
    BOOKS.forEach(group => {
      const id = slug(group.section);
      nav.insertAdjacentHTML("beforeend", `<a class="chip" href="#${id}">${esc(group.section)} <span>${group.items.length}</span></a>`);
      shelves.insertAdjacentHTML("beforeend", `
        <section class="shelf" id="${id}">
          <h2>${esc(group.section)}</h2>
          <div class="shelf-row">
            ${group.items.map(b => `
              <a class="book" href="${link(b)}" target="_blank" rel="noopener" title="${esc(b.title)}${b.sub ? ": " + esc(b.sub) : ""}, by ${esc(b.author)}">
                <span class="cover"><img src="${img(b)}" alt="Cover of ${esc(b.title)}" loading="lazy"></span>
                <span class="book-title">${esc(b.title)}</span>
                <span class="book-author">${esc(b.author)}</span>
              </a>`).join("")}
          </div>
        </section>`);
    });

    // ---------- Spotlight (rotates through every book) ----------
    const all = BOOKS.flatMap(g => g.items.map(b => ({ ...b, section: g.section })));
    // Shuffle so each visit starts somewhere different.
    for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }

    const stage = document.getElementById("spot-stage");
    const dots = document.getElementById("spot-dots");
    all.forEach((b, i) => dots.insertAdjacentHTML("beforeend",
      `<button class="spot-dot" role="tab" aria-label="${esc(b.title)}" data-i="${i}"></button>`));

    let cur = 0, timer = null;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function show(i) {
      cur = (i + all.length) % all.length;
      const b = all[cur];
      stage.innerHTML = `
        <a class="spot-card" href="${link(b)}" target="_blank" rel="noopener">
          <span class="spot-cover"><img src="${img(b)}" alt="Cover of ${esc(b.title)}"></span>
          <span class="spot-text">
            <span class="spot-cat">${esc(b.section)}</span>
            <span class="spot-title">${esc(b.title)}</span>
            ${b.sub ? `<span class="spot-sub">${esc(b.sub)}</span>` : ""}
            ${b.note ? `<span class="spot-note">${esc(b.note)}</span>` : ""}
          </span>
        </a>`;
      dots.querySelectorAll(".spot-dot").forEach((d, k) => d.setAttribute("aria-selected", k === cur));
    }
    function start() { if (!reduce) { stop(); timer = setInterval(() => show(cur + 1), 4500); } }
    function stop() { clearInterval(timer); timer = null; }

    document.getElementById("spot-prev").onclick = () => { show(cur - 1); start(); };
    document.getElementById("spot-next").onclick = () => { show(cur + 1); start(); };
    dots.onclick = e => { const d = e.target.closest(".spot-dot"); if (d) { show(+d.dataset.i); start(); } };
    const spot = document.querySelector(".spotlight");
    spot.addEventListener("mouseenter", stop);
    spot.addEventListener("mouseleave", start);
    spot.addEventListener("focusin", stop);
    spot.addEventListener("focusout", start);

    show(0);
    start();
  </script>
</body>
</html>
